name: Fix PR7 analyzer findings

on:
  push:
    branches:
      - agent/peer-verification-diagnostics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/peer-verification-diagnostics
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: echo "$PATCH_SCRIPT_B64" | base64 --decode | python3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib test integration_test

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "fix: resolve verification analyzer findings"
          git push origin HEAD:agent/peer-verification-diagnostics
