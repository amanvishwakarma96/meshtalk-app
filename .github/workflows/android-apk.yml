name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "android/**"
      - "tool/configure_android_project.sh"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "tool/configure_android_project.sh"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project when missing
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name=meshtalk_app \
              --org=com.amanvishwakarma \
              .
          fi

      - name: Configure Android BLE requirements
        run: bash tool/configure_android_project.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number="${{ github.run_number }}"

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "artifacts/meshtalk-android-${{ github.run_number }}.apk"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: meshtalk-android-apk-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
