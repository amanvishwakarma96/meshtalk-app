name: meshtalk_app
description: Offline-first peer-to-peer chat over BLE mesh and local transports.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.1
  flutter_blue_plus: ^2.3.11
  flutter_riverpod: ^3.4.2
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
