name: meshtalk_multipeer
description: Private MeshTalk bridge for Apple's Multipeer Connectivity framework.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MeshTalkMultipeerPlugin
